<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TextBlocks</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f2f2f7;
    --surface: rgba(255,255,255,0.72);
    --surface-solid: #ffffff;
    --surface-2: rgba(255,255,255,0.45);
    --border: rgba(0,0,0,0.10);
    --border-strong: rgba(0,0,0,0.18);
    --text: #1c1c1e;
    --text-2: #3a3a3c;
    --text-3: #6e6e73;
    --accent: #007aff;
    --accent-light: rgba(0,122,255,0.12);
    --danger: #ff3b30;
    --danger-light: rgba(255,59,48,0.10);
    --green: #34c759;
    --green-light: rgba(52,199,89,0.12);
    --tag-bg: rgba(0,122,255,0.10);
    --tag-text: #0055cc;
    --shadow: 0 2px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
    --blur: blur(20px) saturate(1.8);
    --r: 14px;
    --r-sm: 9px;
    --r-pill: 100px;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --surface: rgba(44,44,46,0.82);
      --surface-solid: #2c2c2e;
      --surface-2: rgba(58,58,60,0.55);
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --text: #f2f2f7;
      --text-2: #ebebf0;
      --text-3: #aeaeb2;
      --accent: #0a84ff;
      --accent-light: rgba(10,132,255,0.18);
      --danger: #ff453a;
      --danger-light: rgba(255,69,58,0.15);
      --green: #30d158;
      --green-light: rgba(48,209,88,0.15);
      --tag-bg: rgba(10,132,255,0.18);
      --tag-text: #5eb5ff;
      --shadow: 0 2px 12px rgba(0,0,0,0.30), 0 1px 3px rgba(0,0,0,0.20);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.40), 0 2px 8px rgba(0,0,0,0.25);
    }
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 20px);
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border-bottom: 0.5px solid var(--border);
    padding: 16px 20px 12px;
    padding-top: max(16px, env(safe-area-inset-top, 16px));
  }

  .app-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .app-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    border: none;
    border-radius: var(--r-pill);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s, transform 0.1s, background 0.15s;
    white-space: nowrap;
    padding: 8px 14px;
    height: 36px;
  }
  .btn:active { transform: scale(0.96); opacity: 0.85; }

  .btn-ghost {
    background: var(--surface-2);
    color: var(--text-2);
    border: 0.5px solid var(--border);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
  }
  .btn-ghost:hover { background: var(--surface); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { opacity: 0.88; }

  .btn-danger {
    background: var(--danger-light);
    color: var(--danger);
  }

  .btn-sm {
    height: 28px;
    padding: 5px 10px;
    font-size: 12px;
  }

  .btn-icon {
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--text-3);
    border: 0.5px solid var(--border);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
  }
  .btn-icon:hover { background: var(--surface); color: var(--text); }

  .main { max-width: 680px; margin: 0 auto; padding: 20px 16px; }

  .glass-card {
    background: var(--surface);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 0.5px solid var(--border);
    border-radius: var(--r);
    box-shadow: var(--shadow);
  }

  .compose-card { padding: 16px; margin-bottom: 16px; }

  .compose-textarea {
    width: 100%;
    font-family: var(--font);
    font-size: 15px;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    min-height: 80px;
    line-height: 1.5;
  }
  .compose-textarea::placeholder { color: var(--text-3); }

  .compose-divider {
    height: 0.5px;
    background: var(--border);
    margin: 10px 0;
  }

  .compose-tags-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
    min-height: 20px;
  }

  .tag-checkbox-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 4px 10px;
    border-radius: var(--r-pill);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .tag-checkbox-label input { display: none; }
  .tag-checkbox-label.checked {
    background: var(--accent);
    color: #fff;
  }

  .compose-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-3);
    margin: 24px 0 10px;
    padding: 0 2px;
  }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }

  .blocks-list { display: flex; flex-direction: column; gap: 10px; }

  .block-card {
    padding: 14px 14px 12px;
    position: relative;
    transition: box-shadow 0.2s, transform 0.15s;
  }
  .block-card.checked-state {
    border-color: var(--accent);
    background: rgba(0,122,255,0.04);
  }

  .block-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .block-checkbox {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
    -webkit-appearance: none;
    appearance: none;
    transition: background 0.15s, border-color 0.15s;
    position: relative;
  }
  .block-checkbox:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .block-checkbox:checked::after {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='12' height='9' viewBox='0 0 12 9' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 4L4.5 7.5L11 1' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") center/12px no-repeat;
  }

  .block-text-wrap { flex: 1; min-width: 0; }

  .block-text {
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
    word-break: break-word;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .block-text.expanded {
    display: block;
    -webkit-line-clamp: unset;
  }
  .block-text b { font-weight: 600; }

  .block-actions-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .block-tags { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }

  .tag-pill {
    font-size: 11px;
    font-weight: 500;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 3px 8px;
    border-radius: var(--r-pill);
  }

  .show-more-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    display: block;
    margin-top: 3px;
  }

  .block-edit-area {
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--r-sm);
    padding: 8px 10px;
    width: 100%;
    resize: none;
    min-height: 60px;
    line-height: 1.5;
    outline: none;
  }
  .block-edit-area:focus { border-color: var(--accent); }

  .edit-block-tags-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
  }

  .edit-block-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    justify-content: flex-end;
  }

  .checked-section {
    margin-top: 24px;
    border-top: 0.5px solid var(--border);
    padding-top: 20px;
  }

  .checked-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .checked-actions { display: flex; gap: 8px; }

  .tags-manager-card { padding: 16px; margin-top: 16px; }

  .tags-manager-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .tags-manager-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .tags-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

  .tag-manage-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 5px 10px;
    border-radius: var(--r-pill);
    font-size: 12px;
    font-weight: 500;
  }

  .tag-manage-item button {
    background: none;
    border: none;
    cursor: pointer;
    color: inherit;
    opacity: 0.65;
    padding: 0;
    font-size: 13px;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .tag-manage-item button:hover { opacity: 1; }

  .add-tag-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .tag-input {
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--r-pill);
    padding: 7px 14px;
    outline: none;
    flex: 1;
    height: 36px;
  }
  .tag-input:focus { border-color: var(--accent); }
  .tag-input::placeholder { color: var(--text-3); }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-3);
    font-size: 14px;
  }
  .empty-state-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }

  .toast {
    position: fixed;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    font-size: 13px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: var(--r-pill);
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 999;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .edit-mode-banner {
    background: rgba(255,149,0,0.12);
    border-radius: var(--r);
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 500;
    color: #bf6600;
    margin-bottom: 12px;
    text-align: center;
    display: none;
  }
  @media (prefers-color-scheme: dark) {
    .edit-mode-banner { color: #ffb84d; }
  }
  .edit-mode-banner.visible { display: block; }

  .io-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  @media (max-width: 480px) {
    .app-title { font-size: 19px; }
    .main { padding: 14px 12px; }
  }

  .fade-in {
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-row">
    <span class="app-title">TextBlocks</span>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" id="editModeBtn">Edit</button>
      <button class="btn btn-ghost btn-sm" id="tagsToggleBtn">Tags</button>
    </div>
  </div>
</header>

<div class="main">

  <div class="edit-mode-banner" id="editModeBanner">Edit mode — tap a block to modify or delete</div>

  <div class="glass-card compose-card">
    <textarea class="compose-textarea" id="composeText" placeholder="Write a text block… use **bold** for emphasis" rows="3"></textarea>
    <div class="compose-divider"></div>
    <div class="compose-tags-row" id="composeTagsRow"></div>
    <div class="compose-actions">
      <button class="btn btn-primary" id="addBlockBtn">Add Block</button>
    </div>
  </div>

  <div class="glass-card tags-manager-card" id="tagsManagerCard" style="display:none;">
    <div class="tags-manager-header">
      <span class="tags-manager-title">Manage Tags</span>
    </div>
    <div class="tags-list" id="tagsManagerList"></div>
    <div class="add-tag-row">
      <input type="text" class="tag-input" id="newTagInput" placeholder="New tag name…" maxlength="30">
      <button class="btn btn-primary btn-sm" id="addTagBtn">Add</button>
    </div>
    <div class="io-row">
      <button class="btn btn-ghost btn-sm" id="exportBtn">Export JSON</button>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer;">
        Import JSON
        <input type="file" accept=".json" id="importFile" style="display:none;">
      </label>
    </div>
  </div>

  <div id="filterSection" style="display:none;">
    <div class="section-label">Filter by tag</div>
    <div class="filter-bar" id="filterBar"></div>
  </div>

  <div id="blocksSection">
    <div class="blocks-list" id="blocksList"></div>
  </div>

  <div class="checked-section" id="checkedSection" style="display:none;">
    <div class="checked-section-header">
      <span class="section-label" style="margin:0;">Selected</span>
      <div class="checked-actions">
        <button class="btn btn-ghost btn-sm" id="copyAllBtn">Copy all</button>
        <button class="btn btn-ghost btn-sm" id="resetCheckedBtn">Uncheck all</button>
      </div>
    </div>
    <div class="blocks-list" id="checkedList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  let blocks = [];
  let tags = [];
  let activeFilters = new Set();
  let editMode = false;
  let tagsOpen = false;
  let expandedBlocks = new Set();
  let editingBlock = null;

  function load() {
    try {
      const b = localStorage.getItem('tb_blocks');
      const t = localStorage.getItem('tb_tags');
      if (b) blocks = JSON.parse(b);
      if (t) tags = JSON.parse(t);
    } catch(e) {}
  }

  function save() {
    localStorage.setItem('tb_blocks', JSON.stringify(blocks));
    localStorage.setItem('tb_tags', JSON.stringify(tags));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function renderBold(text) {
    return text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  }

  function stripMarkdown(text) {
    return text.replace(/\*\*(.+?)\*\*/g, '$1');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function isLong(text) {
    return text.length > 120 || text.split('\n').length > 2;
  }

  function renderBlockText(block) {
    const expanded = expandedBlocks.has(block.id);
    const long = isLong(block.text);
    const html = renderBold(block.text.replace(/\n/g, '<br>'));
    let out = `<div class="block-text${expanded ? ' expanded' : ''}">${html}</div>`;
    if (long) {
      out += `<button class="show-more-btn" data-id="${block.id}">${expanded ? 'Show less' : 'Show more'}</button>`;
    }
    return out;
  }

  function renderTagPills(tagIds) {
    if (!tagIds || tagIds.length === 0) return '';
    const pills = tagIds.map(tid => {
      const tag = tags.find(t => t.id === tid);
      return tag ? `<span class="tag-pill">${tag.name}</span>` : '';
    }).join('');
    return `<div class="block-tags">${pills}</div>`;
  }

  function renderBlockCard(block, inCheckedSection) {
    const checked = block.checked;
    const div = document.createElement('div');
    div.className = `glass-card block-card fade-in${checked ? ' checked-state' : ''}`;
    div.dataset.id = block.id;

    if (editMode && !inCheckedSection) {
      div.innerHTML = `
        <div class="block-top">
          <div class="block-text-wrap">
            <textarea class="block-edit-area" id="edit_${block.id}">${block.text}</textarea>
            <div class="edit-block-tags-row" id="editTags_${block.id}">
              ${tags.map(tag => `
                <label class="tag-checkbox-label${block.tags && block.tags.includes(tag.id) ? ' checked' : ''}">
                  <input type="checkbox" value="${tag.id}" ${block.tags && block.tags.includes(tag.id) ? 'checked' : ''}> ${tag.name}
                </label>
              `).join('')}
            </div>
            <div class="edit-block-actions">
              <button class="btn btn-danger btn-sm" data-action="delete" data-id="${block.id}">Delete</button>
              <button class="btn btn-primary btn-sm" data-action="save" data-id="${block.id}">Save</button>
            </div>
          </div>
        </div>`;
    } else {
      div.innerHTML = `
        <div class="block-top">
          <input type="checkbox" class="block-checkbox" data-id="${block.id}" ${checked ? 'checked' : ''}>
          <div class="block-text-wrap">
            ${renderBlockText(block)}
          </div>
          <button class="btn btn-icon btn-sm" data-copy="${block.id}" title="Copy" style="flex-shrink:0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </button>
        </div>
        <div class="block-actions-row">
          ${renderTagPills(block.tags)}
        </div>`;
    }

    return div;
  }

  function getFilteredBlocks() {
    if (activeFilters.size === 0) return blocks.filter(b => !b.checked);
    return blocks.filter(b => !b.checked && b.tags && b.tags.some(t => activeFilters.has(t)));
  }

  function render() {
    const blocksList = document.getElementById('blocksList');
    const checkedList = document.getElementById('checkedList');
    const checkedSection = document.getElementById('checkedSection');
    const filterSection = document.getElementById('filterSection');
    const filterBar = document.getElementById('filterBar');

    const unchecked = getFilteredBlocks();
    const checked = blocks.filter(b => b.checked);

    blocksList.innerHTML = '';
    if (unchecked.length === 0) {
      blocksList.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📝</div>No blocks yet. Add one above!</div>`;
    } else {
      unchecked.forEach(block => blocksList.appendChild(renderBlockCard(block, false)));
    }

    checkedList.innerHTML = '';
    if (checked.length > 0) {
      checkedSection.style.display = '';
      checked.forEach(block => checkedList.appendChild(renderBlockCard(block, true)));
    } else {
      checkedSection.style.display = 'none';
    }

    if (tags.length > 0) {
      filterSection.style.display = '';
      filterBar.innerHTML = tags.map(tag => `
        <label class="tag-checkbox-label${activeFilters.has(tag.id) ? ' checked' : ''}">
          <input type="checkbox" value="${tag.id}" ${activeFilters.has(tag.id) ? 'checked' : ''}> ${tag.name}
        </label>`).join('');
    } else {
      filterSection.style.display = 'none';
    }

    renderComposeTags();
    renderTagsManager();
    bindEditTagCheckboxes();
  }

  function renderComposeTags() {
    const row = document.getElementById('composeTagsRow');
    if (tags.length === 0) { row.innerHTML = ''; return; }
    row.innerHTML = tags.map(tag => `
      <label class="tag-checkbox-label">
        <input type="checkbox" value="${tag.id}"> ${tag.name}
      </label>`).join('');
    row.querySelectorAll('label').forEach(lbl => {
      const cb = lbl.querySelector('input');
      cb.addEventListener('change', () => {
        lbl.classList.toggle('checked', cb.checked);
      });
    });
  }

  function renderTagsManager() {
    const list = document.getElementById('tagsManagerList');
    if (tags.length === 0) {
      list.innerHTML = `<span style="font-size:13px;color:var(--text-3)">No tags yet.</span>`;
      return;
    }
    list.innerHTML = tags.map(tag => `
      <span class="tag-manage-item">
        ${tag.name}
        <button data-edit-tag="${tag.id}" title="Edit">✎</button>
        <button data-del-tag="${tag.id}" title="Delete">✕</button>
      </span>`).join('');
  }

  function bindEditTagCheckboxes() {
    document.querySelectorAll('.edit-block-tags-row label').forEach(lbl => {
      const cb = lbl.querySelector('input');
      cb.addEventListener('change', () => {
        lbl.classList.toggle('checked', cb.checked);
      });
    });
  }

  function getSelectedTagsFromCompose() {
    return Array.from(document.querySelectorAll('#composeTagsRow input:checked')).map(i => i.value);
  }

  document.getElementById('addBlockBtn').addEventListener('click', () => {
    const ta = document.getElementById('composeText');
    const text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    const selectedTags = getSelectedTagsFromCompose();
    blocks.unshift({ id: uid(), text, checked: false, tags: selectedTags });
    ta.value = '';
    document.querySelectorAll('#composeTagsRow input:checked').forEach(cb => {
      cb.checked = false;
      cb.closest('label').classList.remove('checked');
    });
    save();
    render();
  });

  document.getElementById('composeText').addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      document.getElementById('addBlockBtn').click();
    }
  });

  document.getElementById('editModeBtn').addEventListener('click', () => {
    editMode = !editMode;
    const btn = document.getElementById('editModeBtn');
    btn.textContent = editMode ? 'Done' : 'Edit';
    btn.classList.toggle('btn-primary', editMode);
    btn.classList.toggle('btn-ghost', !editMode);
    document.getElementById('editModeBanner').classList.toggle('visible', editMode);
    render();
  });

  document.getElementById('tagsToggleBtn').addEventListener('click', () => {
    tagsOpen = !tagsOpen;
    document.getElementById('tagsManagerCard').style.display = tagsOpen ? '' : 'none';
    document.getElementById('tagsToggleBtn').classList.toggle('btn-primary', tagsOpen);
    document.getElementById('tagsToggleBtn').classList.toggle('btn-ghost', !tagsOpen);
  });

  document.getElementById('addTagBtn').addEventListener('click', addNewTag);
  document.getElementById('newTagInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addNewTag();
  });

  function addNewTag() {
    const input = document.getElementById('newTagInput');
    const name = input.value.trim();
    if (!name) return;
    if (tags.find(t => t.name.toLowerCase() === name.toLowerCase())) {
      showToast('Tag already exists'); return;
    }
    tags.push({ id: uid(), name });
    input.value = '';
    save();
    render();
  }

  document.getElementById('tagsManagerList').addEventListener('click', e => {
    const editId = e.target.dataset.editTag;
    const delId = e.target.dataset.delTag;
    if (editId) {
      const tag = tags.find(t => t.id === editId);
      if (!tag) return;
      const newName = prompt('Rename tag:', tag.name);
      if (newName && newName.trim()) {
        tag.name = newName.trim();
        save(); render();
      }
    }
    if (delId) {
      if (!confirm('Delete this tag from all blocks?')) return;
      tags = tags.filter(t => t.id !== delId);
      blocks.forEach(b => { if (b.tags) b.tags = b.tags.filter(t => t !== delId); });
      activeFilters.delete(delId);
      save(); render();
    }
  });

  document.getElementById('filterBar').addEventListener('change', e => {
    const cb = e.target;
    if (cb.type !== 'checkbox') return;
    const id = cb.value;
    const label = cb.closest('label');
    if (cb.checked) {
      activeFilters.add(id);
      label.classList.add('checked');
    } else {
      activeFilters.delete(id);
      label.classList.remove('checked');
    }
    render();
  });

  document.getElementById('blocksList').addEventListener('click', handleBlockListClick);
  document.getElementById('checkedList').addEventListener('click', handleBlockListClick);

  function handleBlockListClick(e) {
    const cb = e.target.closest('input.block-checkbox');
    if (cb) {
      const id = cb.dataset.id;
      const block = blocks.find(b => b.id === id);
      if (block) { block.checked = cb.checked; save(); render(); }
      return;
    }

    const copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) {
      const id = copyBtn.dataset.copy;
      const block = blocks.find(b => b.id === id);
      if (block) copyText(stripMarkdown(block.text));
      return;
    }

    const showMore = e.target.closest('.show-more-btn');
    if (showMore) {
      const id = showMore.dataset.id;
      if (expandedBlocks.has(id)) expandedBlocks.delete(id);
      else expandedBlocks.add(id);
      render();
      return;
    }

    const saveBtn = e.target.closest('[data-action="save"]');
    if (saveBtn) {
      const id = saveBtn.dataset.id;
      const block = blocks.find(b => b.id === id);
      if (!block) return;
      const textarea = document.getElementById('edit_' + id);
      if (textarea) block.text = textarea.value;
      const checkedTags = Array.from(document.querySelectorAll(`#editTags_${id} input:checked`)).map(i => i.value);
      block.tags = checkedTags;
      save(); render();
      return;
    }

    const deleteBtn = e.target.closest('[data-action="delete"]');
    if (deleteBtn) {
      const id = deleteBtn.dataset.id;
      if (!confirm('Delete this block?')) return;
      blocks = blocks.filter(b => b.id !== id);
      save(); render();
      return;
    }
  }

  document.getElementById('copyAllBtn').addEventListener('click', () => {
    const checked = blocks.filter(b => b.checked);
    const text = checked.map(b => stripMarkdown(b.text)).join('\n\n');
    copyText(text);
  });

  document.getElementById('resetCheckedBtn').addEventListener('click', () => {
    blocks.forEach(b => b.checked = false);
    save(); render();
  });

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); showToast('Copied!'); }
    catch(e) { showToast('Copy failed'); }
    document.body.removeChild(ta);
  }

  document.getElementById('exportBtn').addEventListener('click', () => {
    const data = { blocks, tags, exported: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'textblocks-export.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Exported!');
  });

  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.blocks) blocks = data.blocks;
        if (data.tags) tags = data.tags;
        save(); render();
        showToast('Imported!');
      } catch { showToast('Invalid file'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  load();
  render();
})();
</script>
</body>
</html>
