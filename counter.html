<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Counters</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .card-label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #8e8e93;
      margin-bottom: 10px;
    }

    .day-number {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -2px;
      color: #1d1d1f;
      line-height: 1;
    }

    .day-subtitle {
      font-size: 14px;
      color: #8e8e93;
      margin-top: 8px;
    }

    .click-btn {
      width: 100%;
      padding: 16px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
      background-color: #0071e3;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      transition: background-color 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .click-btn:hover {
      background-color: #0077ed;
    }

    .click-btn:active {
      background-color: #005cc7;
      transform: scale(0.98);
    }

    .reset-link {
      display: block;
      text-align: center;
      font-size: 13px;
      color: #8e8e93;
      margin-top: 6px;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .reset-link:hover {
      color: #636366;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="card">
    <div class="card-label">Day Streak</div>
    <div class="day-number" id="dayCount">0 🔥</div>
    <div class="day-subtitle" id="daySubtitle">Loading…</div>
  </div>

  <div class="card">
    <div class="card-label">Click Counter</div>
    <button class="click-btn" id="clickBtn" onclick="handleClick()">Clicked 0 times</button>
    <a class="reset-link" onclick="resetClicks()" href="javascript:void(0)">Reset</a>
  </div>

</div>

<script>
  var START_DATE = new Date("2025-01-01");

  function getDaysSince(startDate) {
    var now = new Date();
    var start = new Date(startDate);
    start.setHours(0, 0, 0, 0);
    now.setHours(0, 0, 0, 0);
    var diff = now - start;
    return Math.floor(diff / (1000 * 60 * 60 * 24));
  }

  function updateDayCounter() {
    var days = getDaysSince(START_DATE);
    document.getElementById("dayCount").textContent = days + " 🔥";
    var options = { year: "numeric", month: "long", day: "numeric" };
    var startStr = START_DATE.toLocaleDateString(undefined, options);
    document.getElementById("daySubtitle").textContent = "since " + startStr;
  }

  function getClicks() {
    var val = localStorage.getItem("clickCount");
    return val ? parseInt(val, 10) : 0;
  }

  function saveClicks(n) {
    localStorage.setItem("clickCount", n);
  }

  function updateClickBtn(n) {
    var btn = document.getElementById("clickBtn");
    if (n === 1) {
      btn.textContent = "Clicked 1 time";
    } else {
      btn.textContent = "Clicked " + n + " times";
    }
  }

  function handleClick() {
    var n = getClicks() + 1;
    saveClicks(n);
    updateClickBtn(n);
  }

  function resetClicks() {
    saveClicks(0);
    updateClickBtn(0);
  }

  updateDayCounter();
  updateClickBtn(getClicks());
</script>

</body>
</html>
