<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Tools</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  .container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    text-align: center;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  p {
    color: #6e6e73;
    margin-bottom: 28px;
    font-size: 14px;
  }

  .card {
    background: #ffffff;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
    text-decoration: none;
    color: inherit;
    display: block;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
  }

  .emoji {
    font-size: 24px;
    margin-bottom: 6px;
  }

  .title {
    font-size: 17px;
    font-weight: 600;
  }

  .subtitle {
    font-size: 13px;
    color: #6e6e73;
    margin-top: 4px;
  }

  /* MINI RESET BUTTON */
  .reset-mini {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);

    padding: 8px 14px;
    font-size: 12px;
    font-weight: 500;

    background: rgba(0, 0, 0, 0.06);
    color: #6e6e73;

    border: none;
    border-radius: 999px;

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    cursor: pointer;
    transition: all 0.15s ease;
  }

  .reset-mini:active {
    transform: translateX(-50%) scale(0.95);
    background: rgba(0, 0, 0, 0.1);
  }
</style>

</head>
<body>

<div class="container">
  <h1>Tiny Tools</h1>
  <p>Tiny tools for everyday productivity</p>

  <a href="counter.html" class="card">
    <div class="emoji">🔥</div>
    <div class="title">Counter</div>
    <div class="subtitle">Track your streak & clicks</div>
  </a>

  <a href="textblocks.html" class="card">
    <div class="emoji">📝</div>
    <div class="title">TextBlocks</div>
    <div class="subtitle">Manage notes with tags</div>
  </a>
</div>

<button class="reset-mini" onclick="clearCache()">Reset</button>

<script>
function clearCache() {
  if (!confirm("Delete all app data?")) return;

  localStorage.removeItem("clickCount");
  localStorage.removeItem("tb_blocks");
  localStorage.removeItem("tb_tags");
}
</script>

</body>
</html>
