<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Apps</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    text-align: center;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  p {
    color: #6e6e73;
    margin-bottom: 30px;
  }

  .card {
    background: #ffffff;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    text-decoration: none;
    color: inherit;
    display: block;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
  }

  .title {
    font-size: 18px;
    font-weight: 600;
  }

  .subtitle {
    font-size: 14px;
    color: #6e6e73;
    margin-top: 6px;
  }

  .emoji {
    font-size: 28px;
    margin-bottom: 10px;
  }
</style>

</head>
<body>

<div class="container">

  <h1>My Tools</h1>
  <p>Simple apps I built</p>

  <a href="counter.html" class="card">
    <div class="emoji">🔥</div>
    <div class="title">Counter</div>
    <div class="subtitle">Track your streak & clicks</div>
  </a>

  <a href="textlocks.html" class="card">
    <div class="emoji">📝</div>
    <div class="title">TextBlocks</div>
    <div class="subtitle">Manage notes with tags</div>
  </a>

</div>

</body>
  <button class="reset-btn-fixed" onclick="clearCache()">Reset Data</button>
</html>
